<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقدير الموظف · النموذج التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page-top:#d7dbe1; --page-bot:#f4f5f7; --surface:#ffffff; --text:#002c57; --muted:#667085; --faint:#98a2b3;
  --sig:#c6c6c7; --line:#eef0f3; --head:#f4f6f9; --btn-line:#d0d5dd; --side:#06182c; --side-text:#ffffff;
  --pill:#ffffff; --pill-text:#002c57; --sky:#5aa9e6; --link:#2f6ea5; --accent:#2f6ea5; --doc:#ffffff;
  --ok:#1f7a3e; --ok-bg:#e7f5ec; --warn:#b54708; --warn-bg:#fef0e6; --info:#2f6ea5; --info-bg:#eaf2fa;
  --vio:#6941c6; --vio-bg:#f1ecfb; --neu:#475467; --neu-bg:#f2f4f7; --navyblock:#002c57;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-width:1440px;font-family:"Tajawal",Tahoma,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--page-bot);font-size:14px;line-height:1.55}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ribbon */
.ribbon{background:linear-gradient(270deg,#0b2545 0%,#0e7c86 55%,#1e9e6a 100%);color:#fff}
.rib-in{display:flex;align-items:center;gap:16px;padding:8px 24px;min-height:56px;flex-wrap:wrap}
.rib-label{font-size:13px;font-weight:500;opacity:.88}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#fff;font-size:14px;font-weight:500;padding:7px 18px;border-radius:9px;display:flex;align-items:center;gap:8px}
.seg button .dot{width:8px;height:8px;border-radius:50%}
.seg button[aria-pressed="true"]{background:#fff;color:#002c57;font-weight:700}
.rib-note{margin-inline-start:auto;font-size:12px;opacity:.7}

/* layout */
.layout{display:grid;grid-template-columns:260px 1180px;min-height:968px}
.side{background:var(--side);color:var(--side-text);padding:20px 16px}
.logo{display:flex;align-items:center;gap:12px;padding:6px 6px 26px}
.logo img{display:block;width:198px;height:auto}
.logo b{display:block;font-size:15px;line-height:1.25}
.logo small{display:block;font-size:9px;opacity:.75;margin-top:3px}
.nav{list-style:none;margin:0;padding:0}
.nav button{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;color:var(--side-text);font-size:16px;font-weight:500;padding:10px 16px;border-radius:8px;text-align:right}
.nav button svg{color:var(--side-text)}
.nav button.on{background:var(--pill);color:var(--pill-text);font-weight:700}
.nav button.on svg{color:var(--pill-text)}
.nav li+li{margin-top:4px}
.mainwrap{min-width:0;background:linear-gradient(180deg,var(--page-top),var(--page-bot) 520px)}
.top{display:flex;align-items:center;gap:16px;height:72px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--sig)}
.ham{border:0;background:transparent;color:var(--text);padding:6px;display:flex}
.search{display:flex;align-items:center;gap:8px;width:320px;max-width:42vw;height:40px;border-radius:20px;border:1px solid var(--btn-line);background:var(--head);padding:0 14px;color:var(--faint);font-size:14px}
.search input{border:0;background:transparent;font:inherit;color:var(--text);width:100%;outline:none}
.top .sp{flex:1}
.tic{color:var(--sky);display:flex}
.vdiv{width:1px;height:38px;background:var(--sig)}
.who{text-align:left}
.who b{display:block;font-size:17px;font-weight:500}
.who small{display:block;font-size:12px;color:var(--text);opacity:.85}
.content{padding:24px 40px 56px;width:1180px}

/* shared */
.card{background:var(--surface);border:1px solid var(--sig);border-radius:15px}
.h-sec{font-size:18px;font-weight:700;margin:28px 0 12px;display:flex;align-items:baseline;gap:12px}
.h-sec small{font-size:13px;font-weight:400;color:var(--muted)}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumb button{border:0;background:transparent;color:var(--muted);padding:0;font-size:13px}
.crumb span:last-child{color:var(--text);font-weight:500}
.ptitle{display:flex;align-items:center;gap:16px;margin:12px 0 22px;flex-wrap:wrap}
.ptitle h1{font-size:26px;margin:0;font-weight:700}
.ptitle .tools{margin-inline-start:auto;display:flex;gap:16px;align-items:center}
.back{border:0;background:transparent;color:var(--link);font-size:14px;font-weight:500;padding:6px 0}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--btn-line);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;white-space:nowrap}
.btn.sm{height:34px;font-size:13px;padding:0 14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg.i{width:18px;height:18px}
.lead{padding:20px 28px;font-size:16px;font-weight:500;margin-bottom:20px}
.kpis{display:grid;gap:16px;margin-bottom:28px}
.kpi{padding:18px 20px;min-height:100px}
.kpi .n{font-size:26px;font-weight:800;line-height:1.2}
.kpi .n small{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:6px}
.kpi .l{font-size:13px;color:var(--muted);margin-top:8px}
.tbl{overflow-x:auto;border:1px solid var(--sig);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:var(--head);font-size:12px;font-weight:700;color:var(--neu);text-align:right;padding:13px 16px}
td{font-size:13px;padding:13px 16px;border-top:1px solid var(--line);vertical-align:middle}
td b{font-weight:700}
tr.tot td{background:var(--head);font-weight:700}
.bar{display:flex;align-items:center;gap:12px}
.track{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;justify-content:flex-start}
.fill{height:100%;border-radius:4px;background:#2f6ea5}
.pct{font-size:12px;font-weight:700;min-width:36px;text-align:left}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:11px;white-space:nowrap}
.t-ok{color:var(--ok);background:var(--ok-bg)}.t-warn{color:var(--warn);background:var(--warn-bg)}.t-info{color:var(--info);background:var(--info-bg)}.t-vio{color:var(--vio);background:var(--vio-bg)}.t-neu{color:var(--neu);background:var(--neu-bg)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.info{display:flex;align-items:center;gap:24px;padding:20px 24px;margin-top:20px}
.info .tx{flex:1}
.info .tx b{display:block;font-size:15px;margin-bottom:2px}
.info .tx p{margin:0;color:var(--muted);font-size:14px}
.info .tx p.dark{color:var(--text)}
.ctas{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.src{display:flex;justify-content:space-between;gap:16px;margin-top:28px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.src button{border:0;background:transparent;color:var(--link);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;padding:0}
.amt{unicode-bidi:plaintext}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.greet{font-size:20px;margin:6px 0 20px}
.greet span{color:var(--sky);font-weight:500}
.offer{height:200px;border-radius:15px;overflow:hidden;position:relative;background:#f2f4f7}
.offer img{width:100%;height:100%;object-fit:cover;display:block}
.offer .o1{position:absolute;inset:0;background:radial-gradient(circle at 78% 60%,rgba(120,98,70,.35),transparent 38%),radial-gradient(circle at 22% 40%,rgba(70,96,74,.35),transparent 42%)}
.offer .ot{position:absolute;bottom:18px;right:22px;color:#2a2a24}
.offer .ot b{display:block;font-size:20px}
.offer .ot small{font-size:13px;opacity:.75}
.svc-banner{display:flex;align-items:center;gap:16px;padding:22px 24px;margin-top:20px}
.tile-ic{width:56px;height:56px;border-radius:14px;border:1px solid var(--sig);display:grid;place-items:center;color:var(--sky);flex:none}
.tile-ic svg.i{width:28px;height:28px;stroke-width:1.8}
.svc-banner .tx{flex:1}
.svc-banner b{font-size:19px}
.svc-banner p{margin:4px 0 0;color:var(--muted);font-size:13px}
.svcs{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:20px}
.svc{border:1px solid var(--sig);border-radius:15px;padding:14px 12px 18px;min-height:106px;background:var(--surface);text-align:right;color:var(--text);position:relative}
.svc svg.i{width:18px;height:18px;color:var(--sky);stroke-width:1.3;display:block;margin-bottom:8px}
.svc span{font-size:13px;font-weight:700;line-height:1.35;display:block}
.svc .new{position:absolute;top:14px;left:12px;font-size:10px;font-weight:700;color:#0e7c86;background:#e6f4f1;border-radius:8px;padding:1px 6px}
.quote{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:14px;font-weight:500}
.quote svg{width:24px;height:19px;fill:#c7ccd4;flex:none}
.wala{width:240px;height:240px;margin:56px auto 0;border-radius:18px;background:#0b2545;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;overflow:hidden}
.wala b{font-size:20px}
.att h3{font-size:16px;margin:28px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.att h3 button{border:0;background:transparent;color:var(--sky);font-size:12px;font-weight:500}
.att .row{display:flex;align-items:center;gap:14px;padding:14px 16px}
.att .d{text-align:center;padding-inline-end:14px;border-inline-end:1px solid var(--line)}
.att .d small{display:block;font-size:13px;font-weight:700;color:var(--neu)}
.att .d b{font-size:26px;line-height:1}
.att .t{color:#3d8bd9;font-weight:500;font-size:14px}

/* landing */
.summary{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.summary h2{font-size:20px;margin:0}
.summary .cap{color:var(--muted);font-size:14px;margin:4px 0 8px}
.big{display:flex;align-items:center;gap:10px}
.big b{font-size:34px;font-weight:800;line-height:1}
.big span{color:var(--muted);font-weight:500;font-size:16px}
.eye{width:34px;height:34px;border-radius:10px;border:1px solid var(--btn-line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.eye svg.i{width:18px;height:18px}
.stack{height:12px;border-radius:6px;display:flex;overflow:hidden;background:var(--line);margin-top:10px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-top:16px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{color:var(--muted);flex:1}
.vision{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.vision b{color:var(--accent);font-size:15px}
.vision span{font-size:20px;font-weight:700;color:var(--text)}
.suggest{display:flex;align-items:center;gap:10px;padding:16px 24px;margin-top:16px}
.suggest svg.i{color:var(--accent)}
.suggest p{margin:0;flex:1}
.suggest p b{margin-inline-end:6px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:500;font-size:13px;padding:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{padding:20px;min-height:172px;display:flex;flex-direction:column;text-align:right;color:var(--text);background:var(--surface);border:1px solid var(--sig);border-radius:15px}
.tile .ti{width:40px;height:40px;border-radius:10px;border:1px solid var(--sig);display:grid;place-items:center;color:var(--accent);margin-bottom:14px}
.tile b{font-size:16px}
.tile p{margin:4px 0 0;color:var(--muted);font-size:13px;flex:1}
.tile .go{align-self:flex-end;margin-top:14px;font-size:13px;color:var(--accent);font-weight:500;border:1px solid var(--btn-line);border-radius:10px;padding:5px 14px}
.tile:hover{border-color:var(--btn-line)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:28px;flex-wrap:wrap}
.foot .fb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.foot small{font-size:12px;color:var(--faint)}

/* benefits */
.ben{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bx{padding:14px 16px;min-height:78px}
.bx .r{display:flex;align-items:center;gap:6px}
.bx .r b{font-size:14px;font-weight:500}
.bx .r svg{width:14px;height:14px;color:var(--faint);stroke-width:2.2}
.bx .r .act{margin-inline-start:auto}
.bx p{margin:6px 0 0;font-size:12px;color:var(--muted)}
.bx button.linkbtn{font-weight:700;color:#3f8a4f}

/* payslip */
.ptool{display:flex;gap:10px;justify-content:flex-start;margin-bottom:24px;flex-wrap:wrap}
.period{display:flex;align-items:center;gap:30px;height:40px;padding:0 14px;border:1px solid var(--btn-line);border-radius:10px;background:var(--surface);font-weight:500}
.doc{max-width:920px;margin:0 auto;background:var(--doc);border:1px solid var(--btn-line);border-radius:4px;padding:36px 40px;box-shadow:0 4px 16px rgba(15,25,50,.08)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--text);padding-bottom:16px;margin-bottom:18px}
.dh b{font-size:17px;display:block}
.dh small{font-size:11px;color:var(--muted)}
.dh .ttl{text-align:left}
.dh .ttl b{font-size:20px}
.dh .ttl small{color:#b42318;font-weight:500}
.einfo{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--btn-line);border-radius:2px}
.einfo div{display:grid;grid-template-columns:170px 1fr;border-top:1px solid var(--line);min-height:46px}
.einfo div:nth-child(-n+2){border-top:0}
.einfo div:nth-child(odd){border-inline-end:1px solid var(--btn-line)}
.einfo dt{background:var(--head);padding:7px 12px;font-size:12px;font-weight:700;color:var(--neu)}
.einfo dt small{display:block;font-weight:400;font-size:10px;color:var(--faint)}
.einfo dd{margin:0;padding:12px;font-size:13px;font-weight:500;align-self:center}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.ed .tbl{border-radius:2px;border-color:var(--btn-line)}
.ed table{min-width:0}
.ed caption{caption-side:top;text-align:right;background:var(--head);padding:9px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--btn-line)}
.ed caption small{float:left;font-weight:400;color:var(--muted);font-size:10px}
.ed td{font-size:12px;padding:9px 14px;height:36px}
.ed td.c{color:var(--muted);width:60px}
.ed td.a{text-align:left;width:110px}
.net{display:flex;justify-content:space-between;align-items:center;background:var(--navyblock);color:#fff;border-radius:4px;padding:16px 20px;margin-top:20px}
.net b{display:block;font-size:15px}
.net small{opacity:.7;font-size:11px}
.net .v{font-size:28px;font-weight:800}
.net .v span{font-size:14px;font-weight:500;opacity:.8;margin-inline-end:8px}
.words{font-size:12px;color:var(--neu);margin-top:10px}
.doc h4{font-size:13px;margin:24px 0 10px}
.doc .tbl{border-radius:2px;border-color:var(--btn-line)}
.doc .tbl table{min-width:0}
.dfoot{border-top:1px solid var(--btn-line);margin-top:22px;padding-top:12px;display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}

.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ev{margin:0;overflow:hidden}
.ev .ph{height:170px;background:#f2f4f7}
.ev .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ev figcaption{padding:14px 16px 16px}
.ev b{display:block;font-size:15px;line-height:1.35}
.ev small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.idea{padding:20px;display:flex;flex-direction:column}
.idea .r1{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.idea .r1 small{font-size:12px;color:var(--faint)}
.idea b{font-size:17px}
.idea p{margin:4px 0 14px;color:var(--muted);font-size:13px}
.dep{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--muted)}
.dep em{font-style:normal;font-size:11px;font-weight:700;color:var(--neu);background:var(--neu-bg);border-radius:11px;padding:3px 9px}
.dep em.lead-d{color:#002c57;background:#eaf2fa}
.idea .more{margin-top:auto;align-self:flex-start;border:0;background:none;padding:6px 0 0;color:var(--accent);font-weight:700;font-size:13px;text-decoration:underline}
.h-sub{font-size:16px;margin:28px 0 12px}
.kd{padding:0 24px}
.kr{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.kr:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);flex:none}
.kt{flex:1}.kt b{font-size:14px}.kt p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.kr small{font-size:12px;color:var(--faint)}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0b2545;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{.ribbon,.side,.top,.back,.ptool,.tools,.src,#toast{display:none!important}.layout{display:block}.mainwrap{background:none}.net{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const IC={
home:'<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9v12h14V9"/><path d="M10 21v-6h4v6"/>',
dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
inbox:'<path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1.5 3h5l1.5-3h5"/>',
self:'<circle cx="10" cy="8" r="4"/><path d="M3 20c0-3.5 3-6 7-6 1.2 0 2.3.2 3.2.6"/><circle cx="18" cy="17" r="2.5"/><path d="M18 13v1.5M18 19.5V21M14 17h1.5M20.5 17H22"/>',
apps:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.5"/>',

function crumb(extra=[],last){return `<nav class="crumb" aria-label="مسار التنقل"><button data-go="home">الرئيسية</button><span>‹</span><button data-go="landing">الخدمات الذاتية</button><span>‹</span>${last?`<button data-go="landing">تقدير الموظف</button><span>‹</span>${extra.map(e=>`<button data-go="${e[1]}">${e[0]}</button><span>‹</span>`).join('')}<span>${last}</span>`:'<span>تقدير الموظف</span>'}</nav>`}
function head(title,{back='landing',backLabel='رجوع إلى تقدير الموظف',extra=[],eye=false}={}){
  return crumb(extra,title)+`<div class="ptitle"><h1>${title}</h1><div class="tools">${eye?eyeBtn(true):''}</div></div>`;
}
const eyeBtn=(label)=>label?`<button class="btn sm" data-act="hide">${ic(S.hide?'eye':'eyeoff')}${S.hide?'إظهار المبالغ':'إخفاء المبالغ'}</button>`:`<button class="eye" data-act="hide" aria-label="${S.hide?'إظهار المبالغ':'إخفاء المبالغ'}">${ic(S.hide?'eyeoff':'eye')}</button>`;
const lead=t=>`<div class="card lead">${t}</div>`;
const kpis=items=>`<div class="kpis" style="grid-template-columns:repeat(${items.length},1fr)">${items.map(k=>`<div class="card kpi"><div class="n">${k.v}${k.u?`<small>${k.u}</small>`:''}</div><div class="l">${k.l}</div></div>`).join('')}</div>`;
const bar=(v,label=true,color)=>`<div class="bar"><div class="track"><div class="fill" style="width:${v}%;${color?`background:${color}`:''}"></div></div>${label?`<span class="pct">${v}%</span>`:''}</div>`;
const tag=(t,c)=>`<span class="tag ${c}">${t}</span>`;
function table(cols,rows,tot){return `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th style="${c[1]?`width:${c[1]}`:''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}${tot?`<tr class="tot">${tot.map(c=>`<td>${c}</td>`).join('')}</tr>`:''}</tbody></table></div>`}

function qr(){const N=25,M=6;const g=Array.from({length:N},()=>Array(N).fill(0));const fd=(r0,c0)=>{for(let r=0;r<7;r++)for(let c=0;c<7;c++){const e=r==0||r==6||c==0||c==6,k=r>=2&&r<=4&&c>=2&&c<=4;g[r0+r][c0+c]=(e||k)?1:2}};fd(0,0);fd(0,N-7);fd(N-7,0);
  for(let i=0;i<8;i++)for(const [r,c] of [[7,i],[i,7],[7,N-1-i],[i,N-8],[N-8,i],[N-1-i,7]])if(g[r]&&g[r][c]===0)g[r][c]=2;
  for(let r=0;r<5;r++)for(let c=0;c<5;c++)g[N-9+r][N-9+c]=(r==0||r==4||c==0||c==4||(r==2&&c==2))?1:2;
  let s=42;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;let out='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(g[r][c]===0)g[r][c]=rnd()<.5?1:2;if(g[r][c]===1)out+=`<rect x="${c*M}" y="${r*M}" width="${M}" height="${M}"/>`}
  return `<svg width="150" height="150" viewBox="0 0 150 150" aria-label="رمز QR" role="img"><g fill="#fff">${out}</g></svg>`}

  return head(PAGE.comp,{eye:true})+lead(p.msg.comp)+
   `<div class="card info" style="margin-top:0"><div class="tx"><p class="dark">قسيمة راتب شهر أكتوبر 2026 متاحة الآن. تاريخ الصرف: 27.10.2026.</p></div><button class="btn pri" data-go="payslip">${ic('file')}عرض قسيمة الراتب</button></div>`+
   `<h2 class="h-sec">تفاصيل الراتب السنوي</h2>`+table([['البند','50%'],['شهريًا (ريال)','25%'],['سنويًا (ريال)']],[...all.map(r=>[r[0],monthly(r),`<b class="amt">${m(r[1])}</b>`]),['المكافأة السنوية (صُرفت في 15.03.2026)','-',`<b class="amt">${m(BONUS[S.p])}</b>`]],['الإجمالي',`<span class="amt">${m(mT)}</span>`,`<span class="amt">${m(sum(all.map(r=>r[1]))+BONUS[S.p])}</span>`])+
   `<div class="card info" style="margin-top:28px"><div class="tx"><b>برنامج جسور للرفاه الوظيفي ${tag('متاح لك','t-info')}</b><p>جلسات إرشاد نفسي واجتماعي وأسري مجانية وسرّية لك ولأسرتك من الدرجة الأولى، إضافة إلى الإرشاد المهني والاستشارات الغذائية وورش العمل والفعاليات.</p></div><button class="btn" style="color:var(--accent)" data-demo>الانتقال إلى ZATCA Wellbeing</button></div>`+
   `<h2 class="h-sec">مزايا متاحة لك لم تفعّلها بعد (${inact.length})</h2><div class="ben">${inact.map(b=>box(b,false)).join('')}</div>`+
   `<h2 class="h-sec">مزاياك المفعّلة (${act.length})</h2><div class="ben">${act.map(b=>box(b,true)).join('')}</div>`+src()}
function rewards(){const p=P();
  return head(PAGE.rewards,{eye:true})+lead(p.msg.rewards)+kpis([{v:`<span class="amt">${m(rewT(p))}</span>`,u:'ريال',l:'إجمالي المكافآت المصروفة في 2026'},{v:String(p.rewards.length),l:'مكافآت مصروفة'},{v:p.rewards[p.rewards.length-1][1],l:'تاريخ آخر صرف'}])+
   `<h2 class="h-sec">المكافآت المصروفة 2026</h2>`+table([['المكافأة','55%'],['تاريخ الصرف','20%'],['المبلغ (ريال)']],p.rewards.map(r=>[`<b>${r[0]}</b>`,r[1],`<span class="amt">${m(r[2])}</span>`]))+src()}
function innovation(){return head(PAGE.innovation)+lead('نركز على ثقافة التمكين ومنصة الأفكار؛ أفكارك دائمًا محط اهتمام.')+kpis([{v:'1,240',l:'فكرة مقدّمة'},{v:'310',l:'قيد الدراسة'},{v:'86',l:'طُبّقت في 2026'}])+
  `<h2 class="h-sec">أفكار طُبّقت مؤخرًا</h2><div class="ideas">${IDEAS.map(it=>`<article class="card idea"><div class="r1">${tag('طُبّقت','t-ok')}<small>${it.date}</small></div><b>${it.t}</b><p>${it.d}</p><div class="dep"><span>الجهة المنفذة:</span><em class="lead-d">${it.lead}</em></div>${it.with.length?`<div class="dep"><span>بمشاركة:</span>${it.with.map(w=>`<em>${w}</em>`).join('')}</div>`:''}<button class="more" data-demo>عن الفكرة  ←</button></article>`).join('')}</div>`+
  `<div class="ctas"><button class="btn pri" data-demo>${ic('plus')}تقديم فكرة جديدة</button><button class="btn" data-demo>متابعة أفكاري</button></div>`+
  info(null,'برامج وفعاليات جسور التفاعلية تنشر ثقافة الرفاه وتعزز التواصل بين منسوبي الهيئة.','فعاليات جسور')+src(false)}
function payslip(){const p=P(),E=p.pay.earn,Dd=p.pay.ded,n=Math.max(E.length,Dd.length,4),gE=sum(E.map(x=>x[2])),gD=sum(Dd.map(x=>x[2])),net=gE-gD;
  const rows=a=>Array.from({length:n},(_,i)=>a[i]?`<tr><td class="c">${a[i][0]}</td><td>${a[i][1]}</td><td class="a amt">${m2(a[i][2])}</td></tr>`:'<tr><td class="c"></td><td></td><td class="a"></td></tr>').join('');
  const half=(t,en,a,tot,tl)=>`<div class="tbl"><table><caption>${t}<small>${en}</small></caption><thead><tr><th>الرمز</th><th>البيان</th><th style="text-align:left">المبلغ (ريال)</th></tr></thead><tbody>${rows(a)}<tr class="tot"><td colspan="2">${tl}</td><td class="a amt">${m2(tot)}</td></tr></tbody></table></div>`;
  const inf=[['اسم الموظف','Employee Name',NAME],['فترة الراتب','Pay Period','01.10.2026 - 31.10.2026'],['الرقم الوظيفي','Employee No.',p.empNo],['تاريخ الصرف','Payment Date','27.10.2026'],['المسمى الوظيفي','Job Title',p.title],['مقر العمل','Location',p.loc],['المرتبة / الدرجة','Grade / Step',p.grade],['البنك','Bank',p.pay.bank],['الإدارة','Department',p.dept],['رقم الآيبان','IBAN',S.hide?'•••••':p.pay.iban]];
  return head('قسيمة الراتب',{back:'comp',backLabel:'رجوع إلى المزايا والتعويضات',extra:[['المزايا والتعويضات','comp']],eye:true})+
  `<div class="ptool"><div class="period">الفترة: أكتوبر 2026 ${ic('chev')}</div><button class="btn" data-demo>${ic('dl')}تنزيل PDF</button><button class="btn" data-act="print">${ic('print')}طباعة</button></div>
  <article class="doc">
    <div class="dh"><div><b>هيئة الزكاة والضريبة والجمارك</b><small>Zakat, Tax and Customs Authority</small></div><div class="ttl"><b>قسيمة راتب</b><small>PAYSLIP · سري</small></div></div>
    <dl class="einfo">${inf.map(r=>`<div><dt>${r[0]}<small>${r[1]}</small></dt><dd class="amt">${r[2]}</dd></div>`).join('')}</dl>
    <div class="ed">${half('المستحقات','Earnings',E,gE,'إجمالي المستحقات')}${half('الاستقطاعات','Deductions',Dd,gD,'إجمالي الاستقطاعات')}</div>
    <div class="net"><div><b>صافي الراتب المستحق</b><small>Net Pay</small></div><div class="v"><span>ريال</span><bdi class="amt">${m2(net)}</bdi></div></div>
    <p class="words">المبلغ كتابةً: ${S.hide?'•••••':p.pay.words}</p>
    <h4>المجاميع منذ بداية السنة (YTD)</h4>
    ${table([['البيان'],['الشهر الحالي'],['منذ بداية السنة']],[['المكافأة السنوية (صُرفت في 15.03.2026)',`<span class="amt">${m2(0)}</span>`,`<span class="amt">${m2(BONUS[S.p])}</span>`],['إجمالي المستحقات',`<span class="amt">${m2(gE)}</span>`,`<span class="amt">${m2(gE*10+BONUS[S.p])}</span>`],['إجمالي الاستقطاعات',`<span class="amt">${m2(gD)}</span>`,`<span class="amt">${m2(gD*10)}</span>`]],['صافي الراتب',`<span class="amt">${m2(net)}</span>`,`<span class="amt">${m2(net*10+BONUS[S.p])}</span>`])}
    <p class="words" style="margin-top:16px">رصيد الإجازة الاعتيادية: ${p.pay.leave} يومًا · أيام العمل الفعلية: 22 يومًا · طريقة الدفع: تحويل بنكي</p>
    <div class="dfoot"><span>صدر هذا المستند إلكترونيًا من نظام الموارد البشرية والرواتب ولا يحتاج إلى ختم أو توقيع.</span><span>الرقم المرجعي: PAY-2026-10-${p.empNo} · تاريخ الإصدار: 27.10.2026 09:14</span></div>
  </article>`}

const VIEWS={home,landing,honors,awards,paths,points,learning,comp,payslip,rewards,innovation};
const app=document.getElementById('app');
function render(scroll){if(S.r==='points'&&S.p!=='field')S.r='landing';document.documentElement.style.setProperty('--accent',P().accent);app.innerHTML=shell(VIEWS[S.r]());document.title=(S.r==='home'?'الرئيسية':S.r==='landing'?'تقدير الموظف':PAGE[S.r])+' · تقدير الموظف';if(scroll)window.scrollTo(0,0);try{sessionStorage.setItem('evp-ui',JSON.stringify({p:S.p}))}catch(e){}}
function go(r){if(!ROUTES.includes(r))r='home';if(location.hash!=='#'+r)location.hash=r;else{S.r=r;S.nav=false;render(true)}}
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);S.r=ROUTES.includes(r)?r:'home';S.nav=false;render(true)});
let tt;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200)}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-go]');if(!b)return;
  if(b.dataset.p){S.p=b.dataset.p;render(false);return}
  if(b.dataset.go){go(b.dataset.go);return}
  const a=b.dataset.act;
  if(a==='hide'){S.hide=!S.hide;render(false);return}
  if(a==='fb'){S.fb=true;render(false);return}
  if(a==='nav'){S.nav=!S.nav;render(false);return}
  if(a==='print'){window.print();return}
  if('ext' in b.dataset){toast('تُفتح منصة الأفكار في نافذة خارجية داخل ديوان.');return}
  if('demo' in b.dataset){toast('هذا نموذج توضيحي؛ الإجراء غير مفعّل في العرض.')}
});
function fitStage(){const z=Math.min(1,window.innerWidth/1440);document.body.style.zoom=z}window.addEventListener('resize',fitStage);fitStage();
const r0=location.hash.slice(1);S.r=ROUTES.includes(r0)?r0:'home';render(false);
</script>
</body>
